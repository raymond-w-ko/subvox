<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img">
<title>Reading the layout</title>
<defs><style>text { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }</style></defs>
<rect width="900" height="780" fill="#eef1f3"/>
<text x="56" y="68" font-size="36" fill="#233342" font-weight="700" text-anchor="start" dominant-baseline="middle">Reading the layout</text>
<text x="56" y="116" font-size="23" fill="#657480" font-weight="400" text-anchor="start" dominant-baseline="middle">Tap above the divider; hold below it.</text>
<text x="56" y="150" font-size="23" fill="#657480" font-weight="400" text-anchor="start" dominant-baseline="middle">Small corner labels identify the physical key.</text>
<rect x="56" y="204" width="58" height="46" rx="12" fill="#ffffff" stroke="#d5dce2"/>
<text x="136" y="227" font-size="25" fill="#304351" font-weight="600" text-anchor="start" dominant-baseline="middle">Key</text>
<rect x="56" y="276" width="58" height="46" rx="12" fill="#e5eefb" stroke="#b9cdeb"/>
<text x="136" y="299" font-size="25" fill="#305d91" font-weight="600" text-anchor="start" dominant-baseline="middle">Modifier</text>
<rect x="56" y="348" width="58" height="46" rx="12" fill="#eee8fa" stroke="#cfc0e9"/>
<text x="136" y="371" font-size="25" fill="#675193" font-weight="600" text-anchor="start" dominant-baseline="middle">Hold for layer</text>
<rect x="56" y="420" width="58" height="46" rx="12" fill="#e0f1e9" stroke="#afd4c1"/>
<text x="136" y="443" font-size="25" fill="#2b6b50" font-weight="600" text-anchor="start" dominant-baseline="middle">Switch layer</text>
<rect x="56" y="492" width="58" height="46" rx="12" fill="#fae9e4" stroke="#e8c2b5"/>
<text x="136" y="515" font-size="25" fill="#99513e" font-weight="600" text-anchor="start" dominant-baseline="middle">Key chord</text>
<rect x="56" y="564" width="58" height="46" rx="12" fill="#e0f0f1" stroke="#b0d2d5"/>
<text x="136" y="587" font-size="25" fill="#28666b" font-weight="600" text-anchor="start" dominant-baseline="middle">Tap / hold</text>
<rect x="56" y="636" width="58" height="46" rx="12" fill="#f1f3f5" stroke="#e4e8ec"/>
<text x="136" y="659" font-size="25" fill="#84909b" font-weight="600" text-anchor="start" dominant-baseline="middle">No action</text>
<text x="56" y="739" font-size="20" fill="#657480" font-weight="400" text-anchor="start" dominant-baseline="middle">L / R = left / right modifier. ONE SHOT = one-shot modifier.</text>
</svg>