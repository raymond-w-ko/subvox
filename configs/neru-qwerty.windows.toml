# QWERTY translation of y3owk1n's public Neru config.
#
# Source reference in this repo:
# configs/neru-y3owk1n.toml
#
# Upstream source:
# https://github.com/y3owk1n/nix-system-config-v2/blob/main/modules/home/packages/neru.nix

# ============================================================================
# Theme
# ============================================================================
[theme.light]
surface = "#000000"
accent = "#00AA00"
accent_alt = "#00FF00"
on_accent_alt = "#000000"
text = "#00FF00"

[theme.dark]
surface = "#000000"
accent = "#00AA00"
accent_alt = "#00FF00"
on_accent_alt = "#000000"
text = "#00FF00"

# ============================================================================
# General Settings
# ============================================================================
[general]
hide_overlay_in_screen_share = true
passthrough_unbounded_keys = true
exec_shell = 'C:\Windows\System32\cmd.exe'
exec_shell_args = ["/c"]

# ============================================================================
# Hotkeys
# ============================================================================
[hotkeys]
"Ctrl+Y" = "recursive_grid --cursor-selection-mode hold"
"Ctrl+;" = "scroll"

# ============================================================================
# Hints
# ============================================================================
[hints]
enabled = true

# ============================================================================
# Grid Navigation
# ============================================================================
[grid]
enabled = false

# ============================================================================
# Recursive Grid Navigation
# ============================================================================
[recursive_grid]
enabled = true
grid_cols = 3
grid_rows = 3
keys = "uiojklm,."
min_size_width = 1
min_size_height = 1

[recursive_grid.animation]
enabled = true

[recursive_grid.ui]
font_family = "JetBrainsMonoNLNFP-Bold"
font_size = 12
line_width = 1
highlight_color = "#44000000"
text_color = "#FF00FF00"

[recursive_grid.hotkeys]
# disable defaults
# "space" = "__disabled__"
# "shift+l" = "__disabled__"
"Shift+M" = "__disabled__"
"Shift+I" = "__disabled__"
"Shift+U" = "__disabled__"
"Shift+R" = "__disabled__"
"`" = "__disabled__"

"Tab" = "toggle-cursor-follow-selection"

"q" = "idle"
"w" = "action move_mouse --center"
"e" = "action reset"
"r" = "action left_click --toggle"
"g" = "action move_mouse"
"f" = "action left_click"
"d" = "action middle_click"
"s" = "action right_click"

"Ctrl+C" = "idle"
"Ctrl+J" = "action scroll_down"
"Ctrl+K" = "action scroll_up"
"Ctrl+H" = "action scroll_left"
"Ctrl+L" = "action scroll_right"
"Ctrl+;" = "macro move_and_scroll"

"Shift+H" = "action move_cell --direction left"
"Shift+L" = "action move_cell --direction right"
"Shift+K" = "action move_cell --direction up"
"Shift+J" = "action move_cell --direction down"

# ============================================================================
# Scroll
# ============================================================================
[scroll]
scroll_step = 1

[scroll.hotkeys]
# disable built-in defaults
"Shift+L" = "__disabled__"
"Shift+M" = "__disabled__"
"Shift+I" = "__disabled__"
"Shift+U" = "__disabled__"
"Shift+R" = "__disabled__"

"Ctrl+C" = "idle"
"y" = "action feed ctrl+y"

"Enter" = "action left_click"
"Shift+Enter" = "action middle_click"
"Ctrl+Enter" = "action right_click"

# ============================================================================
# Held Repeat
# ============================================================================
[held_repeat]
enabled = true

# ============================================================================
# Smooth Cursor
# ============================================================================
[smooth_cursor]
move_mouse_enabled = true
steps = 30
max_duration = 100

# ============================================================================
# Smooth Scroll
# ============================================================================
[smooth_scroll]
enabled = true
steps = 300
max_duration = 300
duration_per_pixel = 20.00

# ============================================================================
# Mouse Action Indicator
# ============================================================================
[mouse_action_indicator]
enabled = true

# ============================================================================
# Mode Indicator
# ============================================================================
[mode_indicator.ui]
font_family = "JetBrainsMonoNLNFP-Bold"

# ============================================================================
# Virtual Pointer
# ============================================================================
[virtual_pointer.ui]
font_family = "JetBrainsMonoNLNFP-Bold"

# ============================================================================
# Macro
# ============================================================================
[macros]
move_and_scroll = "run 'action move_mouse --selection' 'scroll'"
